version: '3.8'

services:
  app:
    build: .
    container_name: app_container
    restart: always
    network_mode: "host" # <-- Forces app to share the host network

  db:
    image: mysql:8.0
    container_name: mysql_database
    restart: always
    network_mode: "host" # <-- Forces MySQL to share the host network
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: my_application_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  mysql_data:
