version: '3.8'

services:
  app:
    build: .
    container_name: app_container
    restart: always
    ports:
      - "8000:80"  # Adjust to your app port
    depends_on:
      - db
    networks:
      - app-network  # <-- Add this line
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=my_application_db
      - DB_USERNAME=app_user
      - DB_PASSWORD=app_password

  db:
    image: mysql:8.0
    container_name: mysql_database
    restart: always
    ports:
      - "3306:3306"
    networks:
      - app-network  # <-- Add this line
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: my_application_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  mysql_data:

# Define the shared network bridge here
networks:
  app-network:
    driver: bridge
